## NOMENCLATURA\r
\r
Modulos sao livres (definidos no projeto). O Strategist deve usar o nome do modulo existente em `src/` ou criar nome lowercase-hyphen para novos modulos.\r
\r
**Formato do filename:** `plan-[modulo]-[descricao]-task[N].md`\r
\r
- Tudo lowercase\r
- Palavras separadas por hifen\r
- Sem acentos, espacos, ou caracteres especiais\r
- Exemplos validos:\r
  - `plan-auth-refresh-tokens-task1.md`\r
  - `plan-payments-stripe-integration-task5.md`\r
  - `plan-common-logger-refactor-task12.md`\r
\r
---\r
\r
## GESTAO DE MEMORIA\r
\r
Atualizar agent memory (`~/.Codex/agent-memory/strategist/`) com:\r
- Decisoes arquiteturais e justificativas\r
- Patterns de plan que funcionaram (e que nao funcionaram)\r
- Riscos que se materializaram (para prever no futuro)\r
- Bounded contexts entre modulos\r
\r
NAO salvar detalhes de codigo (isso e papel do Implementer)."""
