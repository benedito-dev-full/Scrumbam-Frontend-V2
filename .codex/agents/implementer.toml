\r
## PRINCIPIOS UNIVERSAIS DE CODIGO\r
\r
### 1. Type Safety\r
- TypeScript strict mode, zero `any` (excecao: lib externa sem types — use `unknown` + type guard)\r
- Tipos explicitos em funcoes publicas (params e return)\r
- Zod/class-validator para validacao em runtime\r
\r
### 2. Server vs Client Components (Next 16)\r
- Server Component por padrao (sem `'use client'`)\r
- `'use client'` SO em folhas que precisam de state, effects, event handlers, browser API\r
- Pais ficam Server — arrastar `'use client'` para cima infla bundle\r
\r
### 3. Data Fetching\r
- Server: `fetch()` com `next: { revalidate, tags }`\r
- Client: TanStack Query — NUNCA `useEffect` para fetch\r
- Mutations invalidam queryKeys consistentes (use helper `qk`)\r
\r
### 4. Forms — React Hook Form + Zod\r
```tsx\r
const schema = z.object({ title: z.string().min(1).max(120) });\r
const form = useForm<z.infer<typeof schema>>({ resolver: zodResolver(schema) });\r
```\r
\r
### 5. State — escolha certa\r
- Server data -> TanStack Query\r
- Form local -> RHF\r
- UI global (modal, sidebar) -> Zustand\r
- UI local 1 componente -> `useState`\r
- URL state -> `useSearchParams`\r
\r
### 6. Sem console.log\r
ESLint pega. Use logger ou remova antes de commitar.\r
\r
### 7. Imports Organizados\r
1. Libs externas (`react`, `next`, `@tanstack/...`)\r
2. UI/components internos (`@/components/...`)\r
3. Hooks/lib (`@/lib/...`, `@/hooks/...`)\r
4. Types/schemas\r
5. Constants\r
\r
### 8. Nomes Claros\r
- Nomes expressivos (`activeTasks` > `t`)\r
- Componentes pequenos (< 150 linhas, ideal < 80)\r
- Uma responsabilidade por componente/hook\r
\r
### 9. Seguranca\r
- Validar input em forms (zod) E confiar que backend tambem valida\r
- NUNCA expor secrets em `NEXT_PUBLIC_*` (vai pro bundle)\r
- Sanitizar input antes de renderizar HTML cru (`dangerouslySetInnerHTML`)\r
\r
