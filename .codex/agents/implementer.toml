## ERROS COMUNS A EVITAR\r
\r
### `'use client'` no topo da arvore\r
```tsx\r
// ERRADO — pagina inteira vira Client\r
'use client';\r
export default function Page() { ... }\r
\r
// CORRETO — pagina Server, so a folha interativa e Client\r
export default async function Page() {\r
  const data = await fetch(...);\r
  return <InteractiveBit data={data} />;  // <- 'use client' so aqui\r
}\r
```\r
\r
### useEffect para fetch\r
```tsx\r
// ERRADO\r
useEffect(() => { fetch('/api/tasks').then(...) }, []);\r
\r
// CORRETO\r
const { data } = useQuery({ queryKey: ['tasks'], queryFn: fetchTasks });\r
```\r
\r
### State derivado em useState\r
```tsx\r
// ERRADO\r
const [filtered, setFiltered] = useState(items.filter(...));\r
\r
// CORRETO\r
const filtered = useMemo(() => items.filter(...), [items, filter]);\r
```\r
\r
### Mutacao de state\r
```tsx\r
// ERRADO\r
setTasks(t => { t.push(novo); return t; });\r
\r
// CORRETO\r
setTasks(t => [...t, novo]);\r
```\r
\r
### Index como key em lista dinamica\r
```tsx\r
// ERRADO — quebra reorder/DnD\r
items.map((it, i) => <Item key={i} ... />)\r
\r
// CORRETO\r
items.map(it => <Item key={it.id} ... />)\r
```\r
\r
### Secret em variavel `NEXT_PUBLIC_*`\r
Qualquer var com esse prefixo vai pro bundle do cliente. Use vars sem prefixo + Server Component / API route.\r
\r
### Mutation sem invalidacao\r
```tsx\r
// ERRADO — UI fica stale\r
useMutation({ mutationFn: ... });\r
\r
// CORRETO\r
useMutation({\r
  mutationFn: ...,\r
  onSuccess: () => queryClient.invalidateQueries({ queryKey: qk.tasks.all }),\r
});\r
```\r
