\r
- Quality:\r
  * Build: PASS, TypeScript: 0 errors\r
  * ESLint: 0 errors\r
  * a11y: aria-label em handles, foco visivel\r
\r
- Documentation:\r
  * JSDoc em KanbanBoard e useTaskMove\r
  * CHANGELOG.md atualizado\r
\r
Closes #42\r
\r
Co-Authored-By: Codex <noreply@anthropic.com>\r
```\r
