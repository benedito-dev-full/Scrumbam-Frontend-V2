<!DOCTYPE html>
<html lang="pt-BR" data-density="normal">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scrumbam — Protótipo Início (mock)</title>
<style>
  /* ============================================================
   * Tokens — copiados HEX-A-HEX de src/app/globals.css (tema .dark)
   * ClickUp exact. NÃO alterar valores.
   * ============================================================ */
  :root {
    --background: #111111;
    --foreground: #e4e4e4;
    --card: #1a1a1a;
    --card-foreground: #e4e4e4;
    --popover: #1a1a1a;
    --popover-foreground: #e4e4e4;
    --primary: #6c63ff;            /* oklch(0.66 0.19 264) ~ aprox. visual; usado só em glows */
    --primary-foreground: #ffffff;
    --secondary: #222222;
    --secondary-foreground: #e4e4e4;
    --muted: #222222;
    --muted-foreground: #888888;
    --accent: #222222;
    --accent-foreground: #e4e4e4;
    --destructive: #f87171;
    --border: rgba(255, 255, 255, 0.07);
    --input: rgba(255, 255, 255, 0.10);
    --ring: rgba(108, 99, 255, 0.45);
    --sidebar: #1a1a1a;
    --sidebar-foreground: #e4e4e4;
    --sidebar-primary: #6c63ff;
    --sidebar-primary-foreground: #ffffff;
    --sidebar-accent: rgba(255, 255, 255, 0.06);
    --sidebar-accent-foreground: #e4e4e4;
    --sidebar-border: rgba(255, 255, 255, 0.07);
    --radius: 0.625rem;

    --row-h: 40px;
    --row-py: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

  body {
    background: var(--background);
    color: var(--foreground);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  button { font-family: inherit; cursor: pointer; }
  button:disabled { cursor: default; }

  /* utilitário scrollbar fino */
  .thin-scroll::-webkit-scrollbar { width: 8px; }
  .thin-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 8px; }
  .thin-scroll::-webkit-scrollbar-track { background: transparent; }

  /* ============================================================
   * Layout raiz — espelha AppShell:
   * topbar (40px) em cima; abaixo: IconRail (60px) + Sidebar (260px) + main
   * ============================================================ */
  .app-shell { display: flex; flex-direction: column; height: 100vh; width: 100vw; overflow: hidden; }
  .app-body { display: flex; min-height: 0; flex: 1; overflow: hidden; }

  /* ── Topbar ── */
  .topbar {
    display: flex; align-items: center; height: 40px; flex-shrink: 0;
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 0 10px 0 8px; gap: 8px; position: relative; z-index: 10;
  }
  .ws-switcher {
    display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px;
    border-radius: 6px; background: none; border: 0; color: var(--foreground);
  }
  .ws-switcher:hover { background: var(--accent); }
  .ws-logo {
    width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
    background: linear-gradient(135deg, #f59e0b 0%, #f97316 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 800; color: #fff;
  }
  .ws-name { font-size: 13px; font-weight: 600; }
  .topbar-icon-btn {
    width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
    border-radius: 6px; background: none; border: 0; color: var(--muted-foreground);
    transition: background .12s, color .12s;
  }
  .topbar-icon-btn:hover { background: var(--accent); color: var(--foreground); }
  .topbar-search-wrap { flex: 1; display: flex; justify-content: center; padding: 0 40px; }
  .topbar-search {
    display: flex; align-items: center; gap: 8px; width: 100%; max-width: 480px; height: 28px;
    background: var(--background); border: 1px solid var(--border); border-radius: 8px;
    padding: 0 10px; color: var(--muted-foreground); font-size: 13px;
  }
  .topbar-search:hover { background: var(--accent); }
  .topbar-search .ph { flex: 1; text-align: left; color: var(--muted-foreground); }
  .topbar-search .kbd { font-size: 11px; opacity: .7; font-family: monospace; }
  .topbar-right { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
  .avatar {
    width: 26px; height: 26px; border-radius: 50%;
    background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: #fff; letter-spacing: .3px; flex-shrink: 0;
  }

  /* ── Icon rail (60px) ── */
  .icon-rail {
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    width: 60px; flex-shrink: 0; height: 100%;
    background: var(--background); border-right: 1px solid var(--border); padding: 6px 0;
  }
  .rail-group { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .rail-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    width: 56px; height: calc(var(--row-h) + 14px); border-radius: 10px; border: 0;
    background: none; color: var(--muted-foreground); transition: background .15s, color .15s;
    text-decoration: none; flex-shrink: 0; position: relative;
  }
  .rail-btn:hover { background: var(--accent); color: var(--foreground); }
  .rail-btn.active {
    color: var(--foreground);
    background: radial-gradient(ellipse 70% 80% at 50% 35%,
      rgba(108,99,255,0.28) 0%, rgba(108,99,255,0.14) 45%, transparent 72%);
  }
  .rail-btn .label {
    font-size: 10px; font-weight: 500; line-height: 1; max-width: 52px; text-align: center;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .rail-home-active {
    width: 30px; height: 30px; border-radius: 50%;
    background: linear-gradient(135deg, #3b5bdb 0%, #4c6ef5 100%);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }

  /* ── Sidebar (workspace panel, 260px) ── */
  .sidebar {
    display: flex; flex-direction: column; height: 100%; width: 260px; flex-shrink: 0;
    background: var(--sidebar);
  }
  .sidebar-header { display: flex; height: 40px; align-items: center; justify-content: space-between; gap: 4px; padding: 0 12px; }
  .sidebar-header .title {
    display: flex; height: 28px; flex: 1; align-items: center; gap: 4px; border-radius: 4px; padding: 0 4px;
    font-size: 13px; font-weight: 600; color: var(--sidebar-foreground); background: none; border: 0; transition: color .12s;
  }
  .sidebar-header .title:hover { color: var(--foreground); }
  .icon-add {
    display: grid; place-items: center; width: 20px; height: 20px; border-radius: 4px;
    color: var(--muted-foreground); background: none; border: 0; transition: background .12s, color .12s;
  }
  .icon-add:hover { background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); }
  .sidebar-scroll { min-height: 0; flex: 1; overflow-y: auto; }
  .sidebar-inner { padding: 0 8px 16px; display: flex; flex-direction: column; gap: 20px; }

  /* item folha (Início: Caixa de entrada, Respostas, etc.) */
  .leaf {
    display: flex; height: calc(var(--row-h) - 6px); align-items: center; gap: 8px;
    border-radius: 5px; padding: 0 12px; font-size: 13px; color: rgba(228,228,228,0.8);
    text-decoration: none; transition: background .12s, color .12s; border: 0; background: none; width: 100%;
  }
  .leaf:hover { background: var(--sidebar-accent); color: var(--sidebar-foreground); }
  .leaf.active { background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); font-weight: 500; }
  .leaf .ic { flex-shrink: 0; color: var(--muted-foreground); display: flex; }
  .leaf .lbl { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* cabeçalho de seção (Favoritos / Espaços) */
  .section-head { margin-bottom: 4px; display: flex; height: 28px; align-items: center; justify-content: space-between; padding: 0 12px; }
  .section-head .lbl {
    display: flex; flex: 1; align-items: center; gap: 4px; font-size: 12px; font-weight: 600;
    color: rgba(228,228,228,0.7); background: none; border: 0; transition: color .12s;
  }
  .section-head .lbl:hover { color: var(--sidebar-foreground); }
  .section-add {
    display: grid; place-items: center; width: 16px; height: 16px; border-radius: 4px;
    color: rgba(136,136,136,0.6); background: none; border: 0;
  }
  .section-add:hover { background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); }

  /* ── Linhas da árvore Space/Folder/List ── */
  .tree-row {
    display: flex; height: 34px; align-items: center; border-radius: 4px; font-size: 13px;
    color: rgba(228,228,228,0.85); transition: background .12s, color .12s; position: relative;
  }
  .tree-row:hover { background: var(--sidebar-accent); color: var(--sidebar-foreground); }
  .tree-row.active { background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); font-weight: 500; }
  .tree-toggle { position: relative; margin-right: 6px; width: 24px; height: 24px; flex-shrink: 0; background: none; border: 0; display: grid; place-items: center; }
  .tree-toggle .chip {
    width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center;
    font-size: 11px; font-weight: 700; color: #fff;
  }
  .tree-toggle.folder-toggle, .tree-toggle.list-toggle { width: 16px; height: 16px; margin-right: 2px; }
  .chevron { transition: transform .15s; color: rgba(228,228,228,0.7); display: flex; }
  .chevron.open { transform: rotate(90deg); }
  .tree-link {
    display: flex; height: 100%; flex: 1; min-width: 0; align-items: center; text-decoration: none;
    color: inherit; overflow: hidden;
  }
  .tree-link .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree-actions { margin-right: 4px; display: none; align-items: center; gap: 2px; flex-shrink: 0; }
  .tree-row:hover .tree-actions { display: flex; }
  .row-icon-btn {
    display: grid; place-items: center; width: 16px; height: 16px; border-radius: 4px;
    color: var(--muted-foreground); background: none; border: 0;
  }
  .row-icon-btn:hover { background: var(--muted); color: var(--foreground); }
  .indent-guide { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--accent); border-radius: 1px; pointer-events: none; }
  .ic-list { color: #a78bfa; }    /* violet-400 — igual ao app */
  .ic-folder { color: var(--muted-foreground); }

  .new-space-btn {
    display: flex; height: 34px; width: 100%; align-items: center; gap: 8px; border-radius: 5px;
    padding: 0 12px; font-size: 13px; color: rgba(136,136,136,0.6); background: none; border: 0; transition: background .12s, color .12s;
  }
  .new-space-btn:hover { background: var(--sidebar-accent); color: var(--sidebar-foreground); }

  /* footer */
  .sidebar-footer { flex-shrink: 0; border-top: 1px solid var(--border); padding: 8px; }
  .footer-btn {
    display: flex; height: calc(var(--row-h) - 6px); width: 100%; align-items: center; gap: 8px;
    border-radius: 5px; padding: 0 12px; font-size: 12px; color: rgba(136,136,136,0.7);
    background: none; border: 0; transition: background .12s, color .12s;
  }
  .footer-btn:hover { background: var(--sidebar-accent); color: var(--sidebar-foreground); }

  /* main */
  .main { min-height: 0; flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  .pad-fallback { padding: 32px; }
  .pad-fallback h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .pad-fallback p { font-size: 13px; color: var(--muted-foreground); line-height: 1.6; max-width: 540px; }
  .pad-fallback .breadcrumb { font-size: 12px; color: var(--muted-foreground); margin-bottom: 24px; }

  /* ============================================================
   * Telas internas (Espaço / Pasta / Lista) — clonadas das pages reais
   * ============================================================ */
  .screen { display: flex; flex-direction: column; height: 100%; background: var(--background); overflow: hidden; }

  /* header da entidade (44px) */
  .ent-header { display: flex; align-items: center; justify-content: space-between; padding: 0 16px; height: 44px; flex-shrink: 0; border-bottom: 1px solid var(--border); }
  .ent-header .left { display: flex; align-items: center; gap: 6px; }
  .ent-chip { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 5px; font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0; }
  .ent-folder-chip { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 5px; background: var(--accent); color: var(--muted-foreground); }
  .ent-name { display: flex; align-items: center; gap: 4px; border: 0; background: none; color: var(--foreground); font-size: 14px; font-weight: 600; }
  .ent-icon-btn { display: grid; width: 24px; height: 24px; place-items: center; border-radius: 5px; border: 0; background: none; color: var(--muted-foreground); }
  .ent-icon-btn:hover { color: var(--foreground); }
  .ent-header .right { display: flex; align-items: center; gap: 4px; }
  .ent-sep { width: 1px; height: 16px; background: var(--border); margin: 0 4px; }
  .share-btn { display: flex; align-items: center; gap: 5px; height: 28px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--border); background: none; color: var(--foreground); font-size: 12px; }
  .share-btn:hover { background: var(--accent); }
  .topbtn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 6px; border: 0; background: none; color: var(--muted-foreground); font-size: 13px; }
  .topbtn:hover { color: var(--foreground); }

  /* tabs (38px) */
  .ent-tabs { display: flex; align-items: center; gap: 2px; padding: 0 16px; height: 38px; flex-shrink: 0; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .ent-tab { display: flex; align-items: center; gap: 5px; height: 36px; padding: 0 10px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted-foreground); font-size: 12px; white-space: nowrap; }
  .ent-tab:hover { color: var(--foreground); }
  .ent-tab.active { color: var(--foreground); font-weight: 600; border-bottom-color: #7c3aed; }
  .ent-tab-plain { display: flex; align-items: center; gap: 5px; height: 36px; padding: 0 10px; border: 0; background: none; color: var(--muted-foreground); font-size: 12px; white-space: nowrap; }
  .ent-tab-plain:hover { color: var(--foreground); }

  /* conteúdo scroll */
  .ent-scroll { flex: 1; overflow-y: auto; padding: 0 16px 40px; }

  /* toolbar */
  .ent-toolbar { display: flex; align-items: center; justify-content: space-between; height: 44px; border-bottom: 1px solid var(--border); }
  .pill-btn { display: flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--border); background: none; color: var(--muted-foreground); font-size: 12px; }
  .pill-btn:hover { background: var(--accent); }
  .meta-txt { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted-foreground); }
  .primary-btn { height: 28px; padding: 0 12px; border-radius: 6px; border: 0; background: #4c6ef5; color: #fff; font-size: 12px; font-weight: 600; }
  .primary-btn:hover { filter: brightness(1.1); }

  /* cards Recent/Docs/Bookmarks */
  .ent-cards { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin: 16px 0; }
  .ent-card { background: var(--card); border-radius: 10px; border: 1px solid var(--border); padding: 16px 18px; min-height: 200px; }
  .ent-card .ct { font-size: 12px; font-weight: 600; color: var(--muted-foreground); margin-bottom: 12px; }
  .ent-card-row { display: flex; align-items: center; gap: 7px; padding: 5px 8px; margin: 0 -8px; border-radius: 6px; text-decoration: none; color: var(--foreground); font-size: 13px; font-weight: 500; }
  .ent-card-row:hover { background: var(--accent); }
  .empty-txt { font-size: 12px; color: var(--muted-foreground); }

  /* section folders/lists */
  .ent-section { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 12px; }
  .ent-section-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--card); }
  .ent-section-head .h { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--foreground); }
  .ent-section-head .acts { display: flex; gap: 4px; }
  .ent-section-head .acts button { width: 24px; height: 24px; display: grid; place-items: center; border: 0; background: none; color: var(--muted-foreground); border-radius: 5px; }
  .ent-section-head .acts button:hover { background: var(--accent); color: var(--foreground); }
  .folders-wrap { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px 16px; background: var(--background); }
  .folder-card { display: flex; align-items: center; gap: 8px; width: 200px; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); text-decoration: none; color: var(--foreground); font-size: 13px; font-weight: 500; }
  .folder-card:hover { background: var(--accent); }
  .lists-wrap { background: var(--background); }
  .list-head-grid, .list-row-grid { display: grid; grid-template-columns: minmax(0,1fr) 80px 180px 120px 120px 100px 100px 36px; padding: 0 16px; align-items: center; min-height: 34px; }
  .list-head-grid { border-bottom: 1px solid var(--border); background: var(--card); }
  .list-head-grid > div { font-size: 11px; color: var(--muted-foreground); font-weight: 500; }
  .list-row-grid { border-bottom: 1px solid var(--border); color: var(--foreground); }
  .list-row-grid:hover { background: var(--accent); }
  .list-row-grid .lr-name { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .add-list-row { display: flex; align-items: center; gap: 7px; padding: 10px 16px; font-size: 13px; color: var(--muted-foreground); background: none; border: 0; width: 100%; text-align: left; }
  .add-list-row:hover { color: var(--foreground); background: var(--accent); }

  /* view switcher da Lista */
  .view-switcher { display: flex; align-items: center; gap: 2px; padding: 0 22px; height: 40px; flex-shrink: 0; border-bottom: 1px solid #26262d; }
  .view-tab { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 6px; border: 0; background: none; color: var(--muted-foreground); font-size: 13px; }
  .view-tab:hover { color: var(--foreground); background: var(--card); }
  .view-tab.active { color: var(--foreground); background: var(--accent); font-weight: 500; }

  /* toolbar da Lista */
  .list-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 22px; height: 44px; border-bottom: 1px solid #26262d; flex-shrink: 0; }
  .tab-btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 6px; border: 0; background: none; color: var(--muted-foreground); font-size: 13px; font-weight: 500; }
  .tab-btn:hover { background: var(--card); color: var(--foreground); }
  .tab-btn.active { background: rgba(124,92,255,0.16); color: #cfc1ff; }

  /* conteúdo da Lista (grupos por status) */
  .list-content { flex: 1; overflow: auto; background: var(--background); }
  .list-content-inner { min-width: 860px; padding: 0 22px 60px; }
  .group-head { display: flex; align-items: center; gap: 8px; padding: 6px 0 8px; margin-top: 16px; }
  .group-caret { width: 18px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted-foreground); background: none; border: 0; transition: transform .15s; }
  .group-caret.closed { transform: rotate(-90deg); }
  .status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 5px; font-size: 11px; font-weight: 700; letter-spacing: .7px; text-transform: uppercase; }
  .group-count { color: var(--muted-foreground); font-size: 12px; }
  .task-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .task-table th { font-weight: 500; color: var(--muted-foreground); font-size: 12px; text-align: left; padding: 6px 10px; border-top: 1px solid #1f1f25; border-bottom: 1px solid #1f1f25; }
  .task-table td { padding: 8px 10px; border-bottom: 1px solid #1f1f25; font-size: 13px; color: var(--foreground); vertical-align: middle; }
  .task-table tr:hover td { background: rgba(255,255,255,0.02); }
  .task-name { display: flex; align-items: center; gap: 8px; }
  .task-id { font-family: monospace; font-size: 11px; color: var(--muted-foreground); }
  .avatar-xs { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 9px; font-weight: 700; color: #fff; }
  .prio-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .inline-pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .add-task-row td { color: var(--muted-foreground); }
  .add-task-row button { display: inline-flex; align-items: center; gap: 7px; color: var(--muted-foreground); background: none; border: 0; font-size: 13px; }
  .add-task-row button:hover { color: var(--foreground); }

  /* ── Menu popover (Criar / Mais) ── */
  .menu {
    position: fixed; z-index: 9999; background: #1a1a1f; border: 1px solid #2a2a2f;
    border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,0.5); padding: 8px 0; min-width: 240px;
  }
  .menu-header { display: flex; align-items: center; gap: 8px; padding: 4px 12px 6px; }
  .menu-header .t { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #52525b; }
  .menu-body { padding: 0 8px; }
  .menu-item {
    display: flex; width: 100%; align-items: flex-start; gap: 12px; border-radius: 6px;
    padding: 8px 12px; text-align: left; background: none; border: 0; transition: background .12s;
  }
  .menu-item:hover { background: #2a2a2f; }

  .dialog {
    width: 420px; max-width: calc(100vw - 32px); background: var(--card); border: 1px solid var(--border);

    width: 760px; max-width: calc(100vw - 32px); max-height: calc(100vh - 64px);

  .choice-card {
    text-align: left; border: 1px solid var(--border); background: var(--background); border-radius: 12px;

  .tpl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

(function buildHive(){
  const svg = document.getElementById('ai-hive');
  const hex=(cx,cy,r)=>{let p='';for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-30);p+=(cx+r*Math.cos(a))+','+(cy+r*Math.sin(a))+' ';}
    return '<polygon points="'+p.trim()+'" fill="none" stroke="currentColor" stroke-width="1.5"/>';};
  const R=4.2,D=7.5,cx=12,cy=12;
  const ns=[[cx,cy-D],[cx+D*Math.cos(Math.PI/6),cy-D*0.5],[cx+D*Math.cos(Math.PI/6),cy+D*0.5],[cx,cy+D],[cx-D*Math.cos(Math.PI/6),cy+D*0.5],[cx-D*Math.cos(Math.PI/6),cy-D*0.5]];
  svg.innerHTML = hex(cx,cy,R)+ns.map(([x,y])=>hex(x,y,R)).join('');
})();

/* ─── RENDER da árvore ─── */
const treeEl = document.getElementById('space-tree');

function findNode(id, nodes=tree, parent=null){
  for (const n of nodes){
    if (n.id===id) return { node:n, parent, siblings:nodes };
    if (n.children){ const r=findNode(id,n.children,n); if(r) return r; }
  }
  return null;
}

function row(node, depth){
  const pad = 8 + depth*20;
  const active = node.id===activeId ? ' active' : '';
  const wrap = document.createElement('div');

  const div = document.createElement('div');
  div.className = 'tree-row'+active;
  div.style.paddingLeft = pad+'px';
  div.dataset.id = node.id;

  /* toggle/chip/ícone */
  if (node.type==='space'){
    const ini = (node.name.trim()[0]||'?').toUpperCase();
    div.innerHTML =
      '<button class="tree-toggle" data-toggle><span class="chip" style="background:'+node.color+'">'+ini+'</span></button>';
  } else if (node.type==='folder'){
    div.innerHTML = '<button class="tree-toggle folder-toggle" data-toggle><span class="ic-folder">'+(node.open?icFolderOpen:icFolder)+'</span></button>';
  } else {
    div.innerHTML = '<span class="tree-toggle list-toggle"><span class="ic-list">'+icList+'</span></span>';
  }

  /* nome */
  const link = document.createElement('a');
  link.className = 'tree-link';
  link.href = '#';
  link.innerHTML = '<span class="nm">'+node.name+'</span>';
  link.addEventListener('click', (e)=>{ e.preventDefault(); navigate(node); });
  div.appendChild(link);

  /* ações (hover) */
  const actions = document.createElement('div');
  actions.className = 'tree-actions';
  actions.innerHTML = '<button class="row-icon-btn" data-more title="Mais ações">'+icMore+'</button>';
  if (node.type!=='list'){
    actions.innerHTML += '<button class="row-icon-btn" data-add title="Adicionar">'+icPlus+'</button>';
  }
  div.appendChild(actions);

  /* toggle expand */
  const tgl = div.querySelector('[data-toggle]');
  if (tgl) tgl.addEventListener('click', (e)=>{ e.stopPropagation(); node.open=!node.open; render(); });

  /* menus */
  const moreBtn = actions.querySelector('[data-more]');
  if (moreBtn) moreBtn.addEventListener('click',(e)=>{e.stopPropagation(); openMoreMenu(moreBtn, node);});
  const addBtn = actions.querySelector('[data-add]');
  if (addBtn) addBtn.addEventListener('click',(e)=>{e.stopPropagation(); openCreateMenu(addBtn, node);});

  wrap.appendChild(div);

  /* filhos */
  if (node.children && node.open){
    const kids = document.createElement('div');
    kids.style.position='relative';
    kids.style.marginTop='2px';
    kids.style.display='flex'; kids.style.flexDirection='column'; kids.style.gap='2px';
    const guide = document.createElement('span');
    guide.className='indent-guide';
    guide.style.left = (8 + depth*20 + 12) + 'px';
    kids.appendChild(guide);
    node.children.forEach(c => kids.appendChild(row(c, depth+1)));
    wrap.appendChild(kids);
  }
  return wrap;
}

function render(){
  treeEl.innerHTML='';
  tree.forEach(s => treeEl.appendChild(row(s,0)));
}

const mainEl = document.getElementById('main');

function navigate(node){
  activeId = node.id;
  // limpa active dos leafs do Início
  document.querySelectorAll('.sidebar-inner .leaf.active').forEach(x=>x.classList.remove('active'));
  render();
  if (node.type==='space') renderSpaceScreen(node);
  else if (node.type==='folder') renderFolderScreen(node);
  else renderListScreen(node);
}

    ['board','Quadro','<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="6" height="18" rx="1"/><rect x="10" y="3" width="6" height="13" rx="1"/><rect x="17" y="3" width="4" height="16" rx="1"/></svg>'],
    ['blocks','Blocos','<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>'],
    ['calendar','Calendário','<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>'],
    ['gantt','Gantt','<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="14" y2="6"/><line x1="7" y1="12" x2="20" y2="12"/><line x1="3" y1="18" x2="16" y2="18"/></svg>'],
  ];
  const viewSwitcher = views.map(([id,lbl,ic],i)=>'<button class="view-tab'+(i===0?' active':'')+'">'+ic+lbl+'</button>').join('');

  const gruposHtml = grupos.map(g=>{
    const cfg = STATUS_CFG[g.status];
    const rows = g.tarefas.map(t=>{
      const p = PRIO_CFG[t.prio];
      const assignee = t.assignee
        ? '<span class="avatar-xs" style="background:'+t.assigneeColor+'">'+t.assignee+'</span>'

      return '<tr><td></td>'+
        '<td><div class="task-name"><span class="task-id">'+t.identifier+'</span><span>'+t.name+'</span></div></td>'+
        '<td>'+assignee+'</td>'+
        '<td>'+due+'</td>'+
        '<td><span style="color:'+p.color+';font-size:12px;"><span class="prio-dot" style="background:'+p.color+'"></span>'+p.label+'</span></td>'+
        '<td><span class="inline-pill" style="background:'+cfg.pillBg+';color:'+cfg.pillColor+'">'+cfg.label+'</span></td>'+
        '<td style="text-align:center;color:var(--muted-foreground);">'+chatIc()+'</td>'+
        '<td></td></tr>';
    }).join('');
    return '<div style="margin-bottom:8px;">'+
      '<div class="group-head"><button class="group-caret">'+caretIc(12)+'</button>'+
        '<span class="status-pill" style="background:'+cfg.pillBg+';color:'+cfg.pillColor+'">'+statusDotIc(cfg.pillColor)+cfg.label+'</span>'+
        '<span class="group-count">'+g.tarefas.length+'</span></div>'+
      '<table class="task-table"><colgroup><col style="width:24px"><col><col style="width:170px"><col style="width:200px"><col style="width:130px"><col style="width:200px"><col style="width:48px"><col style="width:36px"></colgroup>'+
        '<thead><tr><th style="width:24px;padding:0"></th><th style="padding-left:8px">Nome</th><th>Responsável</th><th>Data de vencimento</th><th>Prioridade</th><th>Status</th><th style="text-align:center">'+chatIc()+'</th><th></th></tr></thead>'+
        '<tbody>'+rows+'<tr class="add-task-row"><td></td><td colspan="7"><button>'+plusIc()+'Adicionar tarefa</button></td></tr></tbody>'+

  mainEl.innerHTML =
    '<div class="screen">'+
      '<header class="ent-header" style="height:44px;padding:0 20px;"><div class="left">'+
        icListPurple+
        '<span style="font-size:14px;font-weight:600;color:var(--foreground);">'+list.name+'</span>'+
        '<button class="ent-icon-btn">'+caretIc()+'</button>'+
        '<button class="ent-icon-btn" style="color:#f59e0b">'+starIc(true)+'</button>'+
      '</div><div class="right">'+
        '<button class="topbtn">'+sparkIc()+' Pergunte à IA</button><div class="ent-sep"></div>'+
        '<button class="share-btn">'+shareIc()+'Compartilhar</button>'+
      '</div></header>'+
      '<div class="view-switcher">'+viewSwitcher+'</div>'+
      '<div class="list-toolbar">'+
        '<div style="display:flex;align-items:center;gap:4px;">'+
          '<button class="tab-btn active">'+layersIc()+'Grupo: Status</button>'+
          '<button class="tab-btn">'+forkIc()+'Subtarefas</button>'+
        '</div>'+
        '<div style="display:flex;align-items:center;gap:8px;">'+
          '<span class="meta-txt">'+tasks.length+' tarefas</span>'+

        '</div>'+
      '</div>'+
      '<div class="list-content"><div class="list-content-inner">'+gruposHtml+
        '<button style="display:inline-flex;align-items:center;gap:7px;color:var(--muted-foreground);padding:14px 4px 0;font-size:13px;background:none;border:0;">'+plusIc()+'Novo status</button>'+
      '</div></div>'+
    '</div>';

  // grupos colapsáveis
  mainEl.querySelectorAll('.group-caret').forEach(c=>{
    c.addEventListener('click',()=>{
      const tbl = c.closest('.group-head').nextElementSibling;
      const closed = c.classList.toggle('closed');
      tbl.style.display = closed ? 'none' : 'table';
    });
  });
}

/* liga navegação dos cards/rows da tela de espaço/pasta */
function wireScreen(node){
  mainEl.querySelectorAll('[data-go]').forEach(el=>{
    el.addEventListener('click',(e)=>{ e.preventDefault(); const ref=findNode(el.dataset.go); if(ref) navigate(ref.node); });
  });
  const af = mainEl.querySelector('[data-add-folder]');
  if (af) af.addEventListener('click',()=>openDialog('folder', node));
  const al = mainEl.querySelector('[data-add-list]');
  if (al) al.addEventListener('click',()=>openDialog('list', node));
}

/* ─── MENUS (portal) ─── */
const portal = document.getElementById('portal');
/* remove SÓ os menus flutuantes — não toca em overlays/dialogs/wizard */
function closeMenus(){ portal.querySelectorAll('.menu').forEach(m=>m.remove()); }
document.addEventListener('mousedown',(e)=>{
  if (!e.target.closest('.menu') && !e.target.closest('[data-more]') && !e.target.closest('[data-add]')) closeMenus();
});

function openMoreMenu(btn, node){
  closeMenus();
  const r = btn.getBoundingClientRect();
  const m = document.createElement('div');
  m.className='menu'; m.style.minWidth='200px';
  m.style.top=(r.bottom+4)+'px'; m.style.left=r.left+'px';
  m.innerHTML =
    '<div class="menu-body" style="padding:0 6px;">'+
      simpleItem('star','Favorito')+
      simpleItem('pencil','Renomear', 'rename')+
      simpleItem('copy','Duplicar')+
      '<div class="menu-sep"></div>'+
      simpleItem('trash','Excluir','delete',true)+
    '</div>';
  portal.appendChild(m);
  clampMenu(m);
  m.querySelector('[data-act="rename"]').addEventListener('click',()=>{ closeMenus(); renameNode(node); });
  m.querySelector('[data-act="delete"]').addEventListener('click',()=>{ closeMenus(); deleteNode(node); });
}

function simpleItem(icon, label, act, danger){
  const icons = {
    star:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',

    trash:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',

/* menu "Criar" — Lista / Pasta (igual SpacePlusMenu) */
function openCreateMenu(btn, parentNode){
  closeMenus();
  const r = btn.getBoundingClientRect();
  const isSpace = parentNode.type==='space';
  const m = document.createElement('div');
  m.className='menu'; m.style.width='240px';
  m.style.top=(r.bottom+4)+'px'; m.style.left=(r.right+4)+'px';
  m.innerHTML =
    '<div class="menu-header"><span style="color:#71717a">'+icPlus+'</span><span class="t">Criar</span></div>'+
    '<div class="menu-body">'+
      createItem('list','Lista','Acompanhe tarefas, projetos, pessoas e muito mais')+
      (isSpace ? createItem('folder','Pasta','Agrupe listas, documentos e muito mais') : '')+
    '</div>';
  portal.appendChild(m);
  clampMenu(m);
  m.querySelector('[data-create="list"]').addEventListener('click',()=>{ closeMenus(); openDialog('list', parentNode); });
  const f = m.querySelector('[data-create="folder"]');

}

function createItem(kind, label, desc){
  const ic = kind==='list'
    ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>'
    : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted-foreground)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>';
  return '<button class="menu-item" data-create="'+kind+'"><span class="mi-ic">'+ic+'</span><span><span class="mi-label">'+label+'</span><span class="mi-desc">'+desc+'</span></span></button>';
}

function clampMenu(m){
  const rect = m.getBoundingClientRect();
  if (rect.right > window.innerWidth-8) m.style.left=(window.innerWidth-rect.width-8)+'px';
  if (rect.bottom > window.innerHeight-8) m.style.top=(window.innerHeight-rect.height-8)+'px';
}

/* ─── AÇÕES (mock CRUD) ─── */
function renameNode(node){
  const v = prompt('Renomear '+(node.type==='space'?'espaço':node.type==='folder'?'pasta':'lista')+':', node.name);
  if (v && v.trim()){ node.name=v.trim(); render(); }
}
function deleteNode(node){
  const ref = findNode(node.id);
  if (!ref) return;
  if (!confirm('Excluir "'+node.name+'"?')) return;
  const i = ref.siblings.indexOf(ref.node);
  ref.siblings.splice(i,1);
  render();
}

/* ============================================================
 * MODAL DE CRIAÇÃO DE ESPAÇO — fluxo definido na reunião:
 * passo 1: escolher "vazio" ou "com tasks prontas"
 * passo 2 (se com tasks): galeria de templates agrupada por categoria
 * Aplicar = clona o template num NOVO espaço (cópia independente).
 * ============================================================ */
function openSpaceWizard(){
  closeDialog();
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = '<div class="dialog-lg" id="wiz" style="position:relative;"></div>';
  portal.appendChild(ov);
  ov.addEventListener('mousedown',(e)=>{ if(e.target===ov) closeDialog(); });
  document.addEventListener('keydown', escClose);
  function escClose(e){ if(e.key==='Escape'){ closeDialog(); document.removeEventListener('keydown', escClose); } }
  renderWizStep1();
}

function wizEl(){ return document.getElementById('wiz'); }

/* passo 1 — escolha */
function renderWizStep1(){
  const w = wizEl(); if(!w) return;
  w.innerHTML =
    '<button class="dlg-close" data-close>×</button>'+
    '<div class="dlg-head"><h2>Criar novo espaço</h2><div class="sub">Comece do zero ou use um modelo pronto com tarefas já estruturadas.</div></div>'+
    '<div class="choice-grid">'+
      '<button class="choice-card" data-choice="empty">'+
        '<span class="ci" style="background:rgba(136,136,136,0.15);color:#888">'+
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg>'+
        '</span>'+
        '<span class="cn">Espaço vazio</span>'+
        '<span class="cd">Crie um espaço em branco e adicione pastas, listas e tarefas manualmente.</span>'+
      '</button>'+
      '<button class="choice-card" data-choice="template">'+
        '<span class="ci" style="background:rgba(76,110,245,0.18);color:#7c8cff">'+
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>'+
        '</span>'+
        '<span class="cn">Espaço com tarefas prontas</span>'+
        '<span class="cd">Use um modelo curado pelo Scrumban — já vem com o protocolo de tarefas do tipo de trabalho.</span>'+
      '</button>'+
    '</div>';
  w.querySelector('[data-close]').addEventListener('click', closeDialog);
  w.querySelector('[data-choice="empty"]').addEventListener('click', ()=>{ closeDialog(); openDialog('space', null); });
  w.querySelector('[data-choice="template"]').addEventListener('click', ()=> renderWizStep2());
}

/* passo 2 — galeria de templates por categoria */
let wizActiveCat = null;
function renderWizStep2(){
  const w = wizEl(); if(!w) return;
  const cats = Object.keys(TEMPLATE_LIBRARY);
  if (!wizActiveCat || !cats.includes(wizActiveCat)) wizActiveCat = cats[0];

  const catsHtml = cats.map(c=>
    '<button class="cat-btn'+(c===wizActiveCat?' active':'')+'" data-cat="'+c+'">'+
      '<span>'+c+'</span><span class="count">'+TEMPLATE_LIBRARY[c].length+'</span></button>'
  ).join('');

  const tpls = TEMPLATE_LIBRARY[wizActiveCat];
  const tplsHtml = tpls.map((t,i)=>{
    const ini = t.name.trim()[0].toUpperCase();
    return '<button class="tpl-card" data-tpl="'+i+'">'+
      '<div class="th"><span class="tpl-chip" style="background:'+t.color+'">'+ini+'</span>'+
        '<div><div class="tn">'+t.name+'</div><div class="tmeta">'+wizActiveCat+'</div></div></div>'+
      '<div class="tdesc">'+t.desc+'</div>'+
      '<div class="tcount">'+layersIc()+'~'+t.taskCount+' tarefas no protocolo</div>'+
    '</button>';
  }).join('');

  w.innerHTML =
    '<button class="dlg-close" data-close>×</button>'+
    '<div class="dlg-head"><h2>Escolha um modelo</h2><div class="sub">Modelos curados pelo Scrumban. Ao aplicar, as tarefas são copiadas para um novo espaço independente.</div></div>'+
    '<div class="gallery">'+
      '<div class="gallery-cats">'+catsHtml+'</div>'+
      '<div class="gallery-list"><div class="gallery-title">'+wizActiveCat+' · '+tpls.length+' modelos</div><div class="tpl-grid">'+tplsHtml+'</div></div>'+
    '</div>'+
    '<div class="gallery-foot"><button class="back" data-back>'+caretIc(14)+' Voltar</button>'+
      '<span style="font-size:12px;color:var(--muted-foreground);">Categoria é só um filtro desta galeria — não vira nível na barra lateral.</span></div>';

  w.querySelector('[data-close]').addEventListener('click', closeDialog);
  w.querySelector('[data-back]').addEventListener('click', renderWizStep1);
  w.querySelectorAll('[data-cat]').forEach(b=> b.addEventListener('click', ()=>{ wizActiveCat=b.dataset.cat; renderWizStep2(); }));
  w.querySelectorAll('[data-tpl]').forEach(b=> b.addEventListener('click', ()=> applyTemplate(tpls[Number(b.dataset.tpl)])));
}

/* aplica template → novo espaço com as tasks clonadas (cópia independente) */
function applyTemplate(tpl){
  const space = { id:nextId(), type:'space', name:tpl.name, color:tpl.color, open:true, children: tpl.build() };
  tree.push(space);
  closeDialog();
  render();
  navigate(space);
}

/* ─── DIALOG de criação ─── */
let dialogCtx = null;
function openDialog(kind, parentNode){
  dialogCtx = { kind, parentNode };
  const isSpace = kind==='space';
  const title = isSpace?'Criar Espaço':kind==='folder'?'Criar Pasta':'Criar Lista';
  const sub = isSpace ? 'Espaços agrupam pastas e listas.'
            : kind==='folder' ? 'Em "'+parentNode.name+'".'
            : 'Em "'+parentNode.name+'".';

  const ov = document.createElement('div');
  ov.className='overlay';
  ov.innerHTML =
    '<div class="dialog">'+
      '<h2>'+title+'</h2>'+
      '<div class="sub">'+sub+'</div>'+
      '<label class="field-label">Nome</label>'+
      '<input class="text-input" id="dlg-name" placeholder="'+(isSpace?'Ex: Vendas':kind==='folder'?'Ex: Sprint 12':'Ex: Tarefas')+'" />'+
      (isSpace ? '<div class="color-row" id="dlg-colors"></div>' : '')+
      '<div class="dialog-actions">'+
        '<button class="btn btn-ghost" id="dlg-cancel">Cancelar</button>'+
        '<button class="btn btn-primary" id="dlg-create" disabled>Criar</button>'+
      '</div>'+
    '</div>';
  portal.appendChild(ov);

  let selColor = COLORS[0];
  if (isSpace){
    const cr = ov.querySelector('#dlg-colors');
    COLORS.forEach((c,i)=>{
      const d=document.createElement('button');
      d.className='color-dot'+(i===0?' sel':''); d.style.background=c;
      d.addEventListener('click',()=>{ selColor=c; cr.querySelectorAll('.color-dot').forEach(x=>x.classList.remove('sel')); d.classList.add('sel'); });
      cr.appendChild(d);
    });
  }

  const input = ov.querySelector('#dlg-name');
  const createBtn = ov.querySelector('#dlg-create');
  input.focus();
  input.addEventListener('input',()=>{ createBtn.disabled = !input.value.trim(); });
  input.addEventListener('keydown',(e)=>{ if(e.key==='Enter' && input.value.trim()) doCreate(); if(e.key==='Escape') closeDialog(); });
  ov.querySelector('#dlg-cancel').addEventListener('click', closeDialog);
  ov.addEventListener('mousedown',(e)=>{ if(e.target===ov) closeDialog(); });
  createBtn.addEventListener('click', doCreate);

  function doCreate(){
    const name = input.value.trim();
    if (!name) return;
    if (kind==='space'){
      tree.push({ id:nextId(), type:'space', name, color:selColor, open:true, children:[] });
    } else if (kind==='folder'){
      parentNode.children = parentNode.children||[];
      parentNode.children.push({ id:nextId(), type:'folder', name, open:true, children:[] });
      parentNode.open = true;
    } else {
      parentNode.children = parentNode.children||[];
      parentNode.children.push({ id:nextId(), type:'list', name });
      parentNode.open = true;
    }
    closeDialog(); render();
    // re-renderiza a tela aberta se o item criado é filho dela
    if (parentNode && activeId===parentNode.id) navigate(parentNode);
  }
}
function closeDialog(){ const ov=portal.querySelector('.overlay'); if(ov) ov.remove(); dialogCtx=null; }

/* botões "Novo Espaço" / "+" no header de Espaços → abre o wizard (vazio vs. template) */
document.querySelectorAll('[data-action="new-space"]').forEach(b=>{
  b.addEventListener('click',()=>openSpaceWizard());
});

/* tela de fallback (Início / leafs pessoais) */
function renderFallback(title, desc){
  activeId=null; render();
  mainEl.innerHTML =
    '<div class="pad-fallback">'+
      '<div class="breadcrumb">Início</div>'+
      '<h1>'+title+'</h1>'+
      '<p>'+desc+'</p>'+
    '</div>';
}

/* leafs da seção Início — feedback de ativo + tela mock */
document.querySelectorAll('.sidebar-inner .leaf').forEach(l=>{
  l.addEventListener('click',(e)=>{
    e.preventDefault();
    document.querySelectorAll('.sidebar-inner .leaf').forEach(x=>x.classList.remove('active'));
    l.classList.add('active');
    const t = l.querySelector('.lbl').textContent;
    renderFallback(t, 'Visão pessoal "'+t+'" (mock). Clique num Espaço, Pasta ou Lista na barra lateral para ver o conteúdo interno de cada tela.');
  });
});

render();
renderFallback('Caixa de entrada', 'Protótipo de navegação (mock). Clique nos espaços para expandir pastas e listas, use os botões <b>+</b> em cada nível para criar Espaço, Pasta ou Lista, e clique em qualquer Espaço, Pasta ou Lista para ver o conteúdo interno de cada tela. Tudo roda localmente — sem backend.');
</script>
